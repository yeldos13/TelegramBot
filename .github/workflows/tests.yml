name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AnikiChatBot.slnx -c Release

      - name: Test
        run: dotnet test AnikiChatBot.slnx -c Release --no-build --logger "console;verbosity=normal"
